<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcy Music</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <img id="record-player" src="img/logo.png" alt="record player logo">
        <h1>Marcy Music</h1>
        <nav>
            <ul>
                <li><a class="header-link" href="#">Library</a></li>
                <li><a class="header-link" href="#">Explore</a></li>
                <li><a class="header-link" href="#">Profile</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Playlist</h2>
        <section class="playlist">
            <ul>
                <li class="song-playlist">
                    <figure>
                        <img src="img/playlist-chill.jpg" alt="playlist-chill">
                        <figcaption>Chill Vibes</figcaption>
                    </figure>
                </li>
                <li class="song-playlist">
                    <figure>
                        <img src="img/playlist-focus.jpg" alt="playlist-focus">
                        <figcaption>Focuss</figcaption>
                    </figure>
                </li>
                <li class="song-playlist">
                    <figure>
                        <img src="img/playlist-late-night.jpg" alt="playlist-late-night">
                        <figcaption>Late Night</figcaption>
                    </figure>
                </li>
                <li class="song-playlist">
                    <figure>
                        <img src="img/playlist-love.jpg" alt="playlist-love">
                        <figcaption>Love Songs</figcaption>
                    </figure>
                </li>
                <li class="song-playlist">
                    <figure>
                        <img src="img/playlist-oldies.jpg" alt="playlist-oldies">
                        <figcaption>Oldies</figcaption>
                    </figure>
                </li>
                <li class="song-playlist">
                    <figure>
                        <img src="img/playlist-sad.jpg" alt="playlist-sad">
                        <figcaption>Sad</figcaption>
                    </figure>
                </li>
            </ul>
        </section>

        <h2>Albums</h2>
        <section class="albums">
            <ul>
                <li class="albums-container">
                    <figure>
                        <img src="img/album-midnight-dreams.jpg" alt="album-midnight-dreams">
                        <figcaption>
                            <p>Midnight Dreams</p>
                            <p>Luna Ray</p>
                        </figcaption>
                    </figure>
                </li>
                <li class="albums-container">
                    <figure>
                        <img src="img/album-electric-soul.jpg" alt="album-electric-soul">
                        <figcaption>
                            <p>Electric Soul</p>
                            <p>The Voltage</p>
                        </figcaption>
                    </figure>
                </li>
                <li class="albums-container">
                    <figure>
                        <img src="img/album-golden-hour.jpg" alt="album-golden-hour">
                        <figcaption>
                            <p>Golden Hour</p>
                            <p>Sunset Collective</p>
                        </figcaption>
                    </figure>
                </li>
                <li class="albums-container">
                    <figure>
                        <img src="img/album-kermit-does-jazz.jpg" alt="album-kermit-does-jazz">
                        <figcaption>
                            <p>Kermit Does Jazz</p>
                            <p>Kermit the Frog</p>
                        </figcaption>
                    </figure>
                </li>
            </ul>
        </section>

    </main>
    <footer>
        <p>Made with ❤️ at <a href="https://www.marcylabschool.org/"> Marcy Lab School</a></p>
    </footer>
</body>

</html>
